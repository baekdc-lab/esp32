<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ESP32 센서보드 (MQTT)</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
:root{
  --bg:#0b1020; --card:#131a2b; --tile:#0f1526;
  --txt:#e8eefc; --mut:#9fb2d7; --line:#22314f;
  --green:#00cc66; --blue:#2d6bff; --gray:#32405e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
     font:16px/1.5 system-ui,Segoe UI,Roboto,Apple SD Gothic Neo,sans-serif}
.wrap{max-width:960px;margin:18px auto;padding:0 12px}
.card{background:var(--card);border-radius:16px;padding:16px 16px 18px;
      box-shadow:0 10px 30px rgba(0,0,0,.25)}
.header{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:26px;font-weight:800}
.badge{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:10px}
.tile{background:var(--tile);border-radius:12px;padding:12px;text-align:center;min-height:78px}
.tile .v{font-size:22px;font-weight:800;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{border:0;color:#fff;padding:10px 14px;border-radius:12px;cursor:pointer;
     font-weight:800;min-width:98px;font-size:15px}
.btn-green{background:var(--green)}
.btn-gray{background:var(--gray)}
.hr{height:1px;background:var(--line);margin:14px 0}
.box{background:var(--tile);border-radius:12px;padding:12px;margin-top:10px}
.small{font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div class="header">
      <h1>ESP32 센서보드</h1>
      <span id="conn" class="badge">브로커 연결 중…</span>
    </div>

    <div class="grid">
      <div class="tile"><div>AHT25 온도</div><div id="aht_t" class="v">--.- °C</div></div>
      <div class="tile"><div>AHT25 습도</div><div id="aht_h" class="v">-- %</div></div>
      <div class="tile"><div>SCD42 온도</div><div id="scd_t" class="v">--.- °C</div></div>
      <div class="tile"><div>SCD42 습도</div><div id="scd_h" class="v">-- %</div></div>
      <div class="tile"><div>CO₂</div><div id="co2" class="v">---- ppm</div></div>
    </div>

    <div class="row">
      <button id="ledOn"  class="btn btn-gray">LED ON</button>
      <button id="ledOff" class="btn btn-gray">LED OFF</button>
      <span id="ledStat" class="badge">LED: -</span>
    </div>

    <div class="box">
      <div id="mini" class="small">AHT25: --.- °C | -- % · SCD42: --.- °C | -- % · CO₂: ---- ppm · RSSI: -- dBm</div>
    </div>

  </div>
</div>

<script>
/* ===== MQTT (HiveMQ Cloud WSS) ===== */
const brokerUrl = "wss://6c56aefe0ddb4d57977c735f5070abe8.s1.eu.hivemq.cloud:8884/mqtt";
const options = {
  username: "mqtt_ESP32",
  password: "gomqtt_ESP32",
  clientId: "web-"+Math.random().toString(16).slice(2),
  clean: true,
  reconnectPeriod: 2000
};
const client = mqtt.connect(brokerUrl, options);

/* ===== Elements ===== */
const $ = s => document.querySelector(s);
const el = {
  conn: $('#conn'),
  aht_t: $('#aht_t'), aht_h: $('#aht_h'),
  scd_t: $('#scd_t'), scd_h: $('#scd_h'),
  co2:   $('#co2'),
  ledOn: $('#ledOn'), ledOff: $('#ledOff'), ledStat: $('#ledStat'),
  mini:  $('#mini')
};

/* ===== MQTT Handlers ===== */
client.on('connect', () => {
  el.conn.textContent = '브로커 연결됨';
  client.subscribe('esp32/status');       // 장치→웹: 센서/LED/RSSI
  // 부팅 직후 장치가 3초 주기로 주는 status를 기다리면 됨
});
client.on('reconnect', ()=> el.conn.textContent='브로커 재연결 중…');
client.on('offline',  ()=> el.conn.textContent='브로커 오프라인');
client.on('error',    err=> el.conn.textContent='에러: '+err.message);

client.on('message', (topic, payload) => {
  if(topic!=='esp32/status') return;
  const s = JSON.parse(new TextDecoder().decode(payload));
  renderSensor(s);
});

/* ===== UI Logic ===== */
function n(v){ return Number(v); }
function setLedButtonsState(isOn){
  el.ledOn.className  = 'btn ' + (isOn ? 'btn-green' : 'btn-gray');
  el.ledOff.className = 'btn ' + (!isOn ? 'btn-green' : 'btn-gray');
}
function renderSensor(s){
  if(!Number.isNaN(n(s.aht_t))) el.aht_t.textContent=n(s.aht_t).toFixed(1)+' °C';
  if(!Number.isNaN(n(s.aht_h))) el.aht_h.textContent=Math.round(n(s.aht_h))+' %';
  if(!Number.isNaN(n(s.scd_t))) el.scd_t.textContent=n(s.scd_t).toFixed(1)+' °C';
  if(!Number.isNaN(n(s.scd_h))) el.scd_h.textContent=Math.round(n(s.scd_h))+' %';
  if(!Number.isNaN(n(s.co2)))   el.co2.textContent=Math.round(n(s.co2))+' ppm';
  if(typeof s.led!=='undefined'){
    const on=!!s.led;
    el.ledStat.textContent='LED: '+(on?'ON':'OFF');
    setLedButtonsState(on);
  }
  const rssi = (typeof s.rssi!=='undefined') ? s.rssi : '--';
  el.mini.textContent =
    `AHT25: ${el.aht_t.textContent} | ${el.aht_h.textContent} · `+
    `SCD42: ${el.scd_t.textContent} | ${el.scd_h.textContent} · `+
    `CO₂: ${el.co2.textContent} · RSSI: ${rssi} dBm`;
}

/* LED 제어 → mqtt topic: esp32/led */
el.ledOn.onclick  = ()=> client.publish('esp32/led','on');
el.ledOff.onclick = ()=> client.publish('esp32/led','off');
</script>
</body>
</html>
