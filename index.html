<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ESP32 Remote Dashboard (MQTT over WebSocket)</title>
  <style>
    :root {
      --bg:#0b1220; --fg:#e6eefc; --muted:#9fb3d9; --card:#111a2e; --acc:#4da3ff;
      --ok:#12b981; --warn:#f59e0b; --bad:#ef4444; --border:#26324d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Apple SD Gothic Neo, Noto Sans KR, "맑은 고딕", Arial, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background: radial-gradient(1000px 600px at 10% -10%, #0e1830 0%, #0b1220 60%);
      color: var(--fg);
    }
    h1 { font-size: 1.4rem; margin: 0 0 16px; letter-spacing: .3px; }
    .wrap { max-width: 980px; margin: 0 auto; display: grid; gap: 16px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .row-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    label { font-size: .85rem; color: var(--muted); }
    input, select, button {
      width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
      background: #0e172a; color: var(--fg); outline: none;
    }
    input:focus, select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px rgba(77,163,255,.15); }
    button {
      cursor: pointer; font-weight: 600; transition: transform .03s ease, background .2s ease;
      background: linear-gradient(180deg, #1a2a4a, #0f1b34);
    }
    button:hover { transform: translateY(-1px); }
    .btn-primary { background: linear-gradient(180deg, #2f7aff, #1d65e8); border-color: #2f7aff; }
    .btn-ok { background: linear-gradient(180deg, #15c48f, #11a97b); border-color: #11a97b; }
    .btn-warn { background: linear-gradient(180deg, #f5a524, #e08f10); border-color: #e08f10; }
    .btn-bad { background: linear-gradient(180deg, #ef4444, #d83434); border-color: #d83434; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px;
             font-size: .8rem; border: 1px solid var(--border); background: #0d172b; }
    .kvs { display: grid; gap: 8px; }
    .kv {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: center;
      background: #0b152a; border: 1px dashed var(--border); border-radius: 12px; padding: 10px 12px;
    }
    .kv b { font-size: .95rem; color: #d4e3ff; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .grid-sensors { display: grid; gap: 10px; grid-template-columns: repeat(5, 1fr); }
    .sensor { background: #0c1730; border: 1px solid var(--border); border-radius: 12px; padding: 12px; text-align: center; }
    .sensor .v { font-size: 1.4rem; font-weight: 700; margin-top: 6px; }
    .muted { color: var(--muted); font-size: .85rem; }
    .footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 10px; }
    .sp { height: 6px; }
    @media (max-width: 920px){
      .row, .row-3, .row-4, .grid-sensors { grid-template-columns: 1fr; }
    }
  </style>
  <!-- MQTT.js (browser bundle CDN) -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
  <div class="wrap">
    <h1>ESP32 Remote Dashboard <span class="badge" id="badge">DISCONNECTED</span></h1>

    <div class="card">
      <div class="row-4">
        <div>
          <label>Broker Host</label>
          <input id="host" placeholder="e.g. test.mosquitto.org" value="test.mosquitto.org"/>
        </div>
        <div>
          <label>Port</label>
          <input id="port" type="number" placeholder="e.g. 8081 for wss, 8080 for ws, 1883 not for WS" value="8081"/>
        </div>
        <div>
          <label>Protocol</label>
          <select id="proto">
            <option value="wss" selected>wss (TLS)</option>
            <option value="ws">ws (non-TLS)</option>
          </select>
        </div>
        <div>
          <label>Client ID</label>
          <input id="cid" placeholder="auto" />
        </div>
      </div>
      <div class="sp"></div>
      <div class="row-4">
        <div>
          <label>Username (optional)</label>
          <input id="user" placeholder="username (if needed)"/>
        </div>
        <div>
          <label>Password (optional)</label>
          <input id="pass" type="password" placeholder="password (if needed)"/>
        </div>
        <div>
          <label>Device chipId</label>
          <input id="chip" class="mono" placeholder="e.g. 24A3F00ABCDE" />
        </div>
        <div style="display:flex; gap:8px; align-items:flex-end;">
          <button class="btn-primary" id="btnConnect">Connect</button>
          <button class="btn-bad" id="btnDisconnect">Disconnect</button>
        </div>
      </div>
      <div class="sp"></div>
      <div class="row">
        <div class="kvs">
          <div class="kv"><b>Status topic</b><div class="mono" id="tStatus">-</div></div>
          <div class="kv"><b>Readings topic</b><div class="mono" id="tRead">-</div></div>
          <div class="kv"><b>LED cmd topic</b><div class="mono" id="tCmd">-</div></div>
        </div>
        <div class="kvs">
          <div class="kv"><b>Connection</b><div id="connInfo" class="mono">-</div></div>
          <div class="kv"><b>Last status</b><div id="lastStatus" class="mono">-</div></div>
          <div class="kv"><b>Last readings</b><div id="lastReadings" class="mono">-</div></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="grid-sensors">
        <div class="sensor"><div class="muted">AHT Temp (°C)</div><div class="v" id="aht_t">-</div></div>
        <div class="sensor"><div class="muted">AHT RH (%)</div><div class="v" id="aht_h">-</div></div>
        <div class="sensor"><div class="muted">SCD Temp (°C)</div><div class="v" id="scd_t">-</div></div>
        <div class="sensor"><div class="muted">SCD RH (%)</div><div class="v" id="scd_h">-</div></div>
        <div class="sensor"><div class="muted">CO₂ (ppm)</div><div class="v" id="co2">-</div></div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label>LED</label>
          <div style="display:flex; gap:8px;">
            <button class="btn-ok" id="btnOn">ON</button>
            <button class="btn-warn" id="btnOff">OFF</button>
          </div>
        </div>
        <div>
          <label>Raw incoming JSON</label>
          <textarea id="raw" rows="6" style="width:100%; background:#0b152a; color:#d8e5ff; border:1px solid var(--border); border-radius:12px; padding:10px;"></textarea>
        </div>
      </div>
    </div>

    <div class="footer">GitHub Pages에 올려 HTTPS로 접속 시, 브로커도 <b>WSS</b> 포트를 사용하세요.</div>
  </div>

  <script>
    const $ = (id)=>document.getElementById(id);
    let client = null;
    let topics = { status:"", readings:"", cmd:"" };

    function setBadge(ok){
      const el = $("badge");
      if(ok){ el.textContent = "CONNECTED"; el.style.background = "#0d2b18"; el.style.borderColor = "#114826"; }
      else { el.textContent = "DISCONNECTED"; el.style.background = "#2b1010"; el.style.borderColor = "#4d2631"; }
    }
    setBadge(false);

    function setTopics(){
      const chip = $("chip").value.trim();
      topics.status = `esp32/${chip}/status`;
      topics.readings = `esp32/${chip}/readings`;
      topics.cmd = `esp32/${chip}/cmd/led`;
      $("tStatus").textContent = topics.status;
      $("tRead").textContent = topics.readings;
      $("tCmd").textContent = topics.cmd;
    }
    $("chip").addEventListener("input", setTopics);
    setTopics();

    function connect(){
      if(client){ try{ client.end(true); }catch(e){} client=null; }
      const host = $("host").value.trim();
      const port = Number($("port").value.trim());
      const proto = $("proto").value;
      const url = `${proto}://${host}:${port}/mqtt`;
      const cid = $("cid").value.trim() || `web-${Math.random().toString(16).slice(2)}`;
      const user = $("user").value.trim();
      const pass = $("pass").value;

      setTopics();

      const opts = {
        clientId: cid,
        clean: true,
        reconnectPeriod: 2000,
        connectTimeout: 10_000,
      };
      if(user) opts.username = user;
      if(pass) opts.password = pass;

      $("connInfo").textContent = `${url}  as ${cid}`;

      client = mqtt.connect(url, opts);
      client.on("connect", () => {
        setBadge(true);
        client.subscribe([topics.status, topics.readings], (err) => {
          if(err){ console.warn("subscribe error", err); }
        });
      });
      client.on("reconnect", ()=> { setBadge(false); });
      client.on("close", ()=> { setBadge(false); });
      client.on("error", (e)=> { console.error(e); $("connInfo").textContent = `ERROR: ${e.message || e}`; });

      client.on("message", (topic, payload)=>{
        const text = payload.toString();
        $("raw").value = text;
        try {
          const js = JSON.parse(text);
          if(topic === topics.readings){
            $("lastReadings").textContent = new Date().toLocaleString();
            if("aht_t" in js) $("aht_t").textContent = js.aht_t?.toFixed?.(2) ?? js.aht_t;
            if("aht_h" in js) $("aht_h").textContent = js.aht_h?.toFixed?.(2) ?? js.aht_h;
            if("scd_t" in js) $("scd_t").textContent = js.scd_t?.toFixed?.(2) ?? js.scd_t;
            if("scd_h" in js) $("scd_h").textContent = js.scd_h?.toFixed?.(2) ?? js.scd_h;
            if("co2"   in js) $("co2").textContent   = js.co2?.toFixed?.(1) ?? js.co2;
          } else if(topic === topics.status){
            $("lastStatus").textContent = text;
          }
        } catch(e){
          // non-JSON status messages are fine
          if(topic === topics.status){
            $("lastStatus").textContent = text;
          }
        }
      });
    }

    function disconnect(){
      if(client){ client.end(true); client=null; }
      setBadge(false);
    }

    function publishLed(on){
      if(!client || !client.connected){ alert("Not connected"); return; }
      client.publish(topics.cmd, on ? "on" : "off", { qos: 0, retain: false });
    }

    $("btnConnect").addEventListener("click", connect);
    $("btnDisconnect").addEventListener("click", disconnect);
    $("btnOn").addEventListener("click", ()=>publishLed(true));
    $("btnOff").addEventListener("click", ()=>publishLed(false));
  </script>
</body>
</html>
