<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>LoRa Mesh Monitor (MQTT)</title>
<style>
:root{ --bg:#0b1020; --card:#131a33; --muted:#a8b4d4; --text:#e9eef5; --line:#223; --accent:#2a345e; --accentH:#364178; --okbg:#19381f; --okfg:#7CFF9E; --failbg:#3a1620; --failfg:#ffa3b6; --low:#ff5a6b; }
*{box-sizing:border-box} body{font-family:system-ui,Segoe UI,Arial,sans-serif; padding:14px; background:var(--bg); color:var(--text); margin:0;}
.header{display:flex; align-items:flex-end; justify-content:space-between; margin:0 0 10px}
h1{font-size:19px; margin:0} .clock{font-size:11.5px; color:var(--muted); opacity:.9}
.card{background:var(--card); border-radius:12px; padding:10px; box-shadow:0 2px 10px rgba(0,0,0,.35)}
.row{display:flex; gap:8px; align-items:center; margin:0 0 10px}
input,button{font-size:12.5px} input{padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:#0e1630; color:#e9eef5}
.btn{padding:6px 10px; border:none; border-radius:8px; background:var(--accent); color:var(--text); cursor:pointer}
.btn:hover{background:var(--accentH)}
.small{color:var(--muted); font-size:11.5px}
table{width:100%; border-collapse:collapse; font-size:13px}
th,td{padding:8px 6px; border-bottom:1px solid var(--line)} th{text-align:left; color:var(--muted); font-weight:600}
td.num, th.num{text-align:center} .badge{padding:2px 8px; border-radius:12px; font-size:12px; display:inline-block}
.ok{background:var(--okbg); color:var(--okfg)} .fail{background:var(--failbg); color:var(--failfg)}
.lowbat{color:var(--low); font-weight:700;}
@media (max-width:420px){ body{padding:10px} h1{font-size:18px} .card{padding:10px} table{font-size:12px} th,td{padding:7px 5px} }
</style>
<!-- MQTT.js (browser) -->
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>
<div class="header"><h1>LoRa Mesh Monitor (MQTT)</h1><div id="clock" class="clock">--</div></div>
<div class="card">
  <div class="row">
    <div class="small" id="brokerInfo" style="flex:1"></div>
    <input id="addr" type="number" min="1" max="255" placeholder="addr"/>
    <button class="btn" onclick="sendCmd('LED:1')">LED ON</button>
    <button class="btn" onclick="sendCmd('LED:0')">LED OFF</button>
    <button class="btn" onclick="sendCmd('GET')">GET</button>
  </div>
  <table>
    <thead>
      <tr>
        <th class="num">Node</th><th class="num">BAT (V)</th><th class="num">T (°C)</th>
        <th class="num">RH (%)</th><th class="num">CO2 (ppm)</th><th class="num">LED</th>
        <th class="num">RSSI</th><th class="num">Last OK (s)</th><th>Status</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
const WS_URL = "ws://test.mosquitto.org:8080/mqtt";         // WebSocket MQTT
const TOPIC_NODE = "tswell/mesh/node/+";
const TOPIC_CMD  = "tswell/mesh/cmd/";                       // + addr
document.getElementById('brokerInfo').textContent = "Broker: "+WS_URL+" | Topic: "+TOPIC_NODE;

function updateClock(){
  const n = new Date(), p = s=>s.toString().padStart(2,'0');
  document.getElementById('clock').textContent =
    `${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
}
setInterval(updateClock,1000); updateClock();

const clientId = "web-"+Math.random().toString(16).slice(2);
const client = mqtt.connect(WS_URL, { clientId, clean:true });

client.on('connect', () => {
  client.subscribe(TOPIC_NODE, {qos:0});
});

client.on('message', (topic, payload) => {
  try{
    const j = JSON.parse(payload.toString());
    upsertRow(j);
  }catch(e){ console.error('bad payload', e, payload.toString()); }
});

function sendCmd(cmd){
  const a = Number(document.getElementById('addr').value);
  if(!a || a<1 || a>255){ alert('addr 1~255'); return; }
  client.publish(TOPIC_CMD + a, cmd);
}

const rows = new Map(); // addr -> tr
function upsertRow(n){
  const tb = document.getElementById('tbody');
  let tr = rows.get(n.addr);
  const statusOk = (n.status==='OK');
  const statusCell = statusOk ? '<span class="badge ok">OK</span>' : '<span class="badge fail">-</span>';
  const low = (typeof n.bat==='number' && n.bat < 3.0);
  const nodeCell = `<td class="num ${low?'lowbat':''}">${n.addr}</td>`;
  const tTxt  = (n.t==null)? 'NA' : Number(n.t).toFixed(1);
  const rhTxt = (n.rh==null)? 'NA' : String(n.rh);
  const cTxt  = (n.co2==null)? 'NA' : String(n.co2);
  const html = `
    ${nodeCell}
    <td class="num">${(n.bat??'-')}</td>
    <td class="num">${tTxt}</td>
    <td class="num">${rhTxt}</td>
    <td class="num">${cTxt}</td>
    <td class="num">${(n.led??'-')}</td>
    <td class="num">${(n.rssi??'-')}</td>
    <td class="num">${(n.last_ok_s??'-')}</td>
    <td>${statusCell}</td>`;
  if(!tr){
    tr = document.createElement('tr');
    rows.set(n.addr, tr);
    tb.appendChild(tr);
  }
  tr.innerHTML = html;
}
</script>
</body>
</html>
