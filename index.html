<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 센서 대시보드</title>
  <style>
    :root{
      --bg:#0b1020;--card:#131a2b;--txt:#e8eefc;--mut:#9fb2d7;--line:#22314f;
      --btn-bg:#1b2b4a;--btn-border:#2c3e63;
    }
    :root.light{
      --bg:#f5f7fa;--card:#ffffff;--txt:#0b1020;--mut:#5a6b8a;--line:#ccd4e0;
      --btn-bg:#e4e8ef;--btn-border:#b0bacb;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.6 Pretendard,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Apple SD Gothic Neo,Malgun Gothic,NanumBarunGothic,Helvetica Neue,Arial,system-ui,Noto Sans KR,sans-serif;transition:background .3s,color .3s}
    .wrap{max-width:900px;margin:20px auto;padding:0 12px}
    .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    h1{margin:0 0 8px;font-size:28px}
    .mut{color:var(--mut);margin:2px 0 14px}
    hr{border:0;border-top:1px solid var(--line);margin:16px 0}
    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .tile{background:#0f1628;border:1px solid #1c2a46;border-radius:12px;padding:12px}
    .tile>div:first-child{font-size:13px;color:var(--mut);margin-bottom:6px}
    .v{font-size:24px;font-weight:700}
    .btn{border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--txt);padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600}
    .btn:active{transform:translateY(1px)}
    .btn.on{background:#2c4a7a}
    .btn.off{background:#2a3148}
    .toggle-row{display:flex;gap:10px;margin:12px 0;align-items:center;flex-wrap:wrap}
    .theme-toggle{margin-left:auto;cursor:pointer;font-size:20px}
    .collapsible{max-height:0;overflow:hidden;transition:max-height .35s ease}
    .collapsible.open{max-height:1200px}
    .tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
    table{border-collapse:collapse;width:100%}
    th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:center}
    th{position:sticky;top:0;background:rgba(0,0,0,.15);backdrop-filter:blur(6px)}
    .canvas-wrap{display:grid;gap:14px}
    canvas{width:100%;height:220px;background:#0f1628;border:1px solid #1c2a46;border-radius:12px}
    .legend{display:flex;gap:10px;font-size:12px;color:var(--mut);margin:6px 2px;flex-wrap:wrap}
    @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>ESP32 센서 대시보드 <span id="themeToggle" class="theme-toggle">🌙</span></h1>
    <p class="mut">AHT25(온/습) + SCD42(온/습/CO₂) · LED제어</p>

    <div class="grid">
      <div class="tile"><div>AHT25 온도</div><div id="aht_t" class="v">--.- °C</div></div>
      <div class="tile"><div>AHT25 습도</div><div id="aht_h" class="v">-- %</div></div>
      <div class="tile"><div>SCD42 온도</div><div id="scd_t" class="v">--.- °C</div></div>
      <div class="tile"><div>SCD42 습도</div><div id="scd_h" class="v">-- %</div></div>
      <div class="tile"><div>CO₂ 공기</div><div id="scd_c" class="v">---- ppm</div></div>
    </div>

    <div class="toggle-row">
      <button class="btn on" id="on">LED ON</button>
      <button class="btn off" id="off">LED OFF</button>
      <span class="mut">LED: <span id="led">-</span></span>
    </div>

    <hr>
    <div class="toggle-row">
      <button class="btn" id="toggleTable">📋 테이블 보기</button>
      <button class="btn" id="toggleGraph">📊 그래프 보기</button>
    </div>

    <div id="tableSection" class="collapsible">
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>시간</th><th>AHT25 온도</th><th>AHT25 습도</th><th>SCD42 온도</th><th>SCD42 습도</th><th>CO₂</th><th>LED</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="graphSection" class="collapsible">
      <div class="legend">
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#7ab8ff;margin-right:4px"></span>AHT25 온도</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff9a7a;margin-right:4px"></span>SCD42 온도</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#7ae0ff;margin-right:4px"></span>AHT25 습도</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#ffd07a;margin-right:4px"></span>SCD42 습도</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#8aff7a;margin-right:4px"></span>CO₂</span>
      </div>
      <div class="canvas-wrap">
        <canvas id="chTemp"></canvas>
        <canvas id="chHum"></canvas>
        <canvas id="chCO2"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
/* ===== ESP32 주소 고정 ===== */
const BASE = "http://192.168.31.204"; // ← ESP32 IP 고정
function fullUrl(path){ return BASE + path; }

/* ===== 기본 설정 ===== */
const $=s=>document.querySelector(s);
const fastMs=3000, maxRows=60;

/* ===== 테마 ===== */
const themeToggle=$('#themeToggle');
(function(){
  const k='themeMode';
  const apply=m=>{document.documentElement.className=(m==='light'?'light':'');themeToggle.textContent=(m==='light'?'🌞':'🌙');};
  const cur=localStorage.getItem(k)||'';apply(cur);
  themeToggle.onclick=()=>{const m=document.documentElement.classList.contains('light')?'':'light';localStorage.setItem(k,m);apply(m);};
})();

/* ===== 데이터 ===== */
let histBuf=[];
async function getJSON(u){
  const r=await fetch(fullUrl(u),{cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

/* ===== 상태 ===== */
async function refreshFast(){
  try{
    const s=await getJSON("/api/status");
    $('#aht_t').textContent=(Number.isFinite(s.aht_t)?s.aht_t.toFixed(1):'--.-')+' °C';
    $('#aht_h').textContent=(Number.isFinite(s.aht_h)?s.aht_h.toFixed(0):'--')+' %';
    $('#scd_t').textContent=(Number.isFinite(s.scd_t)?s.scd_t.toFixed(1):'--.-')+' °C';
    $('#scd_h').textContent=(Number.isFinite(s.scd_h)?s.scd_h.toFixed(0):'--')+' %';
    $('#scd_c').textContent=(Number.isFinite(s.co2)?s.co2.toFixed(0):'----')+' ppm';
    $('#led').textContent=s.led?'ON':'OFF';
  }catch(e){console.warn('상태 갱신 실패',e);}
}

/* ===== 로그 ===== */
function normalize(o){return{
  aht_t:Number(o.aht_t)||NaN,aht_h:Number(o.aht_h)||NaN,
  scd_t:Number(o.scd_t)||NaN,scd_h:Number(o.scd_h)||NaN,
  co2:Number(o.co2)||NaN,led:o.led?1:0,ts:Number(o.timestamp)||0
};}

function renderTable(){
  const tb=$('#tbody');tb.innerHTML='';
  const rows=Math.min(maxRows,histBuf.length);
  for(let i=histBuf.length-rows;i<histBuf.length;i++){
    const r=histBuf[i];const tr=document.createElement('tr');
    const td=t=>{const d=document.createElement('td');d.textContent=t;tr.appendChild(d);};
    td(r.ts?new Date(r.ts*1000).toLocaleString():'--');
    td(r.aht_t.toFixed(1)+' °C');td(r.aht_h.toFixed(0)+' %');
    td(r.scd_t.toFixed(1)+' °C');td(r.scd_h.toFixed(0)+' %');
    td(r.co2.toFixed(0)+' ppm');td(r.led?'ON':'OFF');
    tb.appendChild(tr);
  }
}

/* ===== 그래프 ===== */
function drawChart(canvas,series){
  if(!canvas)return;
  const ctx=canvas.getContext('2d'),W=canvas.clientWidth,H=canvas.clientHeight;
  const DPR=window.devicePixelRatio||1;canvas.width=W*DPR;canvas.height=H*DPR;ctx.scale(DPR,DPR);
  ctx.clearRect(0,0,W,H);
  ctx.globalAlpha=.8;ctx.lineWidth=1;ctx.strokeStyle='#314469';
  for(let y=H-30;y>20;y-=40){ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-10,y);ctx.stroke();}
  ctx.globalAlpha=1;
  const n=histBuf.length;if(!n)return;
  function range(a){let mn=+Infinity,mx=-Infinity;for(const v of a){if(Number.isFinite(v)){mn=Math.min(mn,v);mx=Math.max(mx,v);}}return[mn,mx];}
  const ranges=series.map(s=>range(s.data));
  let mn=Math.min(...ranges.map(r=>r[0])),mx=Math.max(...ranges.map(r=>r[1]));
  if(!Number.isFinite(mn)||!Number.isFinite(mx)){mn=0;mx=1;}if(mx===mn){mx=mn+1;}
  const pad=0.05*(mx-mn);mn-=pad;mx+=pad;
  const yAt=v=>H-30-((v-mn)/(mx-mn))*(H-60),xAt=i=>40+(W-60)*(i/(n-1||1));
  const colors=['#7ab8ff','#ff9a7a','#7ae0ff','#ffd07a','#8aff7a'];
  series.forEach((s,si)=>{ctx.beginPath();ctx.lineWidth=2;ctx.strokeStyle=colors[si%colors.length];
    let moved=false;for(let i=0;i<n;i++){const v=s.data[i];const x=xAt(i);
      if(Number.isFinite(v)){const y=yAt(v);if(!moved){ctx.moveTo(x,y);moved=true;}else ctx.lineTo(x,y);}else moved=false;}
    ctx.stroke();});
}

function renderAllCharts(){
  if(!$('#graphSection').classList.contains('open'))return;
  const aht_t=histBuf.map(r=>r.aht_t),scd_t=histBuf.map(r=>r.scd_t);
  const aht_h=histBuf.map(r=>r.aht_h),scd_h=histBuf.map(r=>r.scd_h);
  const co2=histBuf.map(r=>r.co2);
  drawChart($('#chTemp'),[{data:aht_t},{data:scd_t}]);
  drawChart($('#chHum'),[{data:aht_h},{data:scd_h}]);
  drawChart($('#chCO2'),[{data:co2}]);
}

/* ===== 데이터 로드 ===== */
async function loadHistory(){
  try{
    const arr=await getJSON("/api/history?limit=60");
    histBuf=arr.map(normalize);
    renderTable();renderAllCharts();
  }catch(e){console.warn('히스토리 실패',e);}
}

/* ===== 버튼 ===== */
function setOpen(el,on){el.classList[on?'add':'remove']('open');}
$('#toggleTable').onclick=()=>{const el=$('#tableSection');setOpen(el,!el.classList.contains('open'));renderTable();};
$('#toggleGraph').onclick=()=>{const el=$('#graphSection');setOpen(el,!el.classList.contains('open'));renderAllCharts();};

$('#on').onclick=async()=>{await fetch(fullUrl("/api/led?state=on"));refreshFast();};
$('#off').onclick=async()=>{await fetch(fullUrl("/api/led?state=off"));refreshFast();};

/* ===== 시작 ===== */
(async()=>{
  await loadHistory();
  await refreshFast();
  setInterval(refreshFast,fastMs);
  setInterval(loadHistory,60000);
})();
</script>
</body>
</html>
